<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entregas | Floricultura</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../styles/entregas.css" />
  </head>
  <body>
    <main class="deliveries-page">
      <header class="page-header"><div><p class="eyebrow">Logística</p><h1>Entregas</h1><p class="page-intro">Organize os próximos destinos e acompanhe cada pedido até a porta.</p></div><span class="access-label">Controle operacional</span></header>
      <div class="deliveries-layout">
        <section class="delivery-form-panel" aria-labelledby="form-title">
          <p class="eyebrow">Novo agendamento</p><h2 id="form-title">Agendar entrega</h2>
          <form id="formEntrega">
            <label for="clienteSelect">Cliente <span>(nome, telefone e CPF/CNPJ obrigatórios)</span></label>
            <select id="clienteSelect" required><option value="">Selecione o cliente</option></select>
            <label for="dataEntrega">Data da entrega</label><input type="date" id="dataEntrega" required />
            <label for="horarioEntrega">Horário</label><input type="time" id="horarioEntrega" required />
            <label for="endereco">Endereço de entrega</label><input type="text" id="endereco" placeholder="Rua, número, bairro, cidade" required />
            <label for="observacao">Observações <span>(opcional)</span></label><textarea id="observacao" rows="4" placeholder="Instruções para a entrega..."></textarea>
            <p id="form-feedback" class="feedback" role="alert"></p><button class="primary-button" type="submit">Confirmar agendamento</button>
          </form>
        </section>
        <section class="deliveries-surface" aria-labelledby="list-title">
          <div class="surface-heading"><div><p class="eyebrow">Rota de hoje e próximos dias</p><h2 id="list-title">Entregas agendadas</h2></div><span id="delivery-count" class="delivery-count"></span></div>
          <p id="list-feedback" class="feedback" role="status"></p>
          <div class="table-wrap"><table><thead><tr><th>Data / hora</th><th>Cliente</th><th>Telefone</th><th>Endereço</th><th>Status</th><th>Ações</th></tr></thead><tbody id="tabelaEntregasBody"></tbody></table></div>
        </section>
      </div>
    </main>
    <script src="../../services/authService.js"></script>
    <script src="./entregas.js"></script>
  </body>
</html>
