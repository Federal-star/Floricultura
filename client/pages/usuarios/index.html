<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usuários | Floricultura</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../styles/usuarios.css" />
  </head>
  <body>
    <main class="users-page">
      <header class="page-header">
        <div>
          <p class="eyebrow">Equipe</p>
          <h1>Usuários</h1>
          <p class="page-intro">Gerencie quem cuida de cada parte da floricultura.</p>
        </div>
        <div class="header-actions">
          <span id="current-user" class="current-user"></span>
          <button id="new-user" class="primary-button" type="button">Novo usuário</button>
        </div>
      </header>

      <section class="users-surface" aria-label="Lista de usuários">
        <div class="surface-heading"><span>Usuários cadastrados</span><span id="user-count" class="user-count"></span></div>
        <p id="page-feedback" class="feedback" role="status" aria-live="polite"></p>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Status</th><th><span class="sr-only">Ações</span></th></tr></thead>
            <tbody id="users-table"></tbody>
          </table>
        </div>
      </section>
    </main>

    <div id="user-modal" class="modal-backdrop" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button id="close-modal" class="close-button" type="button" aria-label="Fechar">×</button>
        <p class="eyebrow">Cadastro de equipe</p>
        <h2 id="modal-title">Novo usuário</h2>
        <form id="user-form">
          <input id="user-id" type="hidden" />
          <label for="user-name">Nome</label><input id="user-name" required />
          <label for="user-email">E-mail</label><input id="user-email" type="email" required />
          <label for="user-role">Perfil</label>
          <select id="user-role"><option value="VENDEDOR">Vendedor</option><option value="GERENTE">Gerente</option><option value="ADMIN">Administrador</option></select>
          <label for="user-password">Senha <span id="password-hint">(obrigatória)</span></label><input id="user-password" type="password" autocomplete="new-password" />
          <p id="modal-feedback" class="feedback" role="alert"></p>
          <button class="primary-button" type="submit">Salvar usuário</button>
        </form>
      </section>
    </div>
    <script src="../../services/authService.js"></script>
    <script src="../../services/usuariosService.js"></script>
    <script src="./usuarios.js"></script>
  </body>
</html>
