<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar | Floricultura</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../styles/login.css" />
  </head>
  <body>
    <main class="login-shell">
      <section class="welcome-panel" aria-label="Boas-vindas">
        <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
        <p class="eyebrow">Gestão que floresce</p>
        <h1>O cuidado começa nos bastidores.</h1>
        <p class="welcome-copy">Organize sua floricultura com clareza, presença e um olhar atento para cada detalhe.</p>
        <div class="botanical-line" aria-hidden="true"></div>
      </section>

      <section class="form-panel">
        <div class="form-wrap">
          <p class="eyebrow">Acesso interno</p>
          <h2>Bem-vindo de volta</h2>
          <p class="form-intro">Entre para acompanhar o ritmo da sua operação.</p>

          <form id="login-form" novalidate>
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="voce@floricultura.com" required />

            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" autocomplete="current-password" placeholder="Digite sua senha" required />

            <p id="login-feedback" class="feedback" role="alert" aria-live="polite"></p>
            <button id="login-button" type="submit"><span class="button-label">Entrar no sistema</span><span class="button-spinner" aria-hidden="true"></span></button>
          </form>
        </div>
        <p class="footer-note">Acesso protegido para a equipe da floricultura</p>
      </section>
    </main>
    <script src="../../services/authService.js"></script>
    <script src="./login.js"></script>
  </body>
</html>
