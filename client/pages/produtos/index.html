<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo | Floricultura</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../styles/produtos.css" />
  </head>
  <body>
    <main class="catalog-page">
      <header class="page-header">
        <div><p class="eyebrow">Catálogo e estoque</p><h1>Produtos</h1><p class="page-intro">Tudo o que floresce, decora e abastece a loja.</p></div>
        <button id="new-product" class="primary-button" type="button">Novo produto</button>
      </header>
      <section class="catalog-surface">
        <div class="filters"><label for="category-filter">Categoria</label><select id="category-filter"><option value="">Todas as categorias</option><option value="PLANTA">Plantas</option><option value="VASO">Vasos</option><option value="INSUMO">Insumos</option><option value="ARRANJO">Arranjos</option><option value="OUTROS">Outros</option></select><span id="catalog-feedback" class="feedback" role="status"></span></div>
        <div class="table-wrap"><table><thead><tr><th>Produto</th><th>SKU</th><th>Categoria</th><th>Preço</th><th>Estoque</th><th><span class="sr-only">Ações</span></th></tr></thead><tbody id="products-table"></tbody></table></div>
        <div class="pagination"><button id="previous-page" class="page-button" type="button">Anterior</button><span id="page-indicator"></span><button id="next-page" class="page-button" type="button">Próxima</button></div>
      </section>
    </main>

    <div id="product-modal" class="modal-backdrop" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button id="close-modal" class="close-button" type="button" aria-label="Fechar">×</button><p class="eyebrow">Cadastro de catálogo</p><h2 id="modal-title">Novo produto</h2><form id="product-form"><input id="product-id" type="hidden" /><div class="form-grid"><div><label for="product-name">Nome</label><input id="product-name" required /></div><div><label for="product-sku">SKU</label><input id="product-sku" required /></div><div><label for="product-category">Categoria</label><select id="product-category" required><option value="PLANTA">Planta</option><option value="VASO">Vaso</option><option value="INSUMO">Insumo</option><option value="ARRANJO">Arranjo</option><option value="OUTROS">Outros</option></select></div><div><label for="product-price">Preço de venda</label><input id="product-price" type="number" min="0" step="0.01" required /></div><div><label for="product-stock">Estoque</label><input id="product-stock" type="number" min="0" step="1" required /></div><div><label for="product-image">URL da imagem</label><input id="product-image" type="url" placeholder="https://..." /></div></div><label for="product-description">Descrição</label><textarea id="product-description" rows="2"></textarea><div id="botanical-fields" class="botanical-fields"><div class="section-heading"><span>Ficha botânica</span><span>Para plantas</span></div><div class="form-grid"><div><label for="product-watering">Rega</label><input id="product-watering" placeholder="2x por semana" /></div><div><label for="product-light">Iluminação</label><input id="product-light" placeholder="Meia-sombra" /></div></div><label for="product-care">Cuidados</label><textarea id="product-care" rows="2"></textarea></div><p id="modal-feedback" class="feedback" role="alert"></p><button class="primary-button" type="submit">Salvar produto</button></form></section></div>
    <script src="../../services/authService.js"></script><script src="../../services/produtosService.js"></script><script src="./produtos.js"></script>
  </body>
</html>
