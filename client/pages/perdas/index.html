<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perdas | Floricultura</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../styles/perdas.css" />
  </head>
  <body>
    <main class="losses-page">
      <header class="page-header"><div><p class="eyebrow">Controle de estoque</p><h1>Perdas e descartes</h1><p class="page-intro">Registre o que saiu do estoque e acompanhe os motivos.</p></div><span class="access-label">Acesso administrativo</span></header>
      <div class="losses-layout">
        <section class="loss-form-panel" aria-labelledby="form-title"><p class="eyebrow">Nova baixa</p><h2 id="form-title">Registrar perda</h2><form id="loss-form"><label for="product-search">Produto</label><input id="product-search" list="product-options" placeholder="Busque por nome ou SKU" autocomplete="off" required /><datalist id="product-options"></datalist><input id="product-id" type="hidden" /><p id="product-stock" class="stock-hint"></p><label for="loss-quantity">Quantidade</label><input id="loss-quantity" type="number" min="1" step="1" placeholder="0" required /><label for="loss-reason">Motivo</label><select id="loss-reason" required><option value="">Selecione um motivo</option><option value="DETERIORACAO">Deterioração</option><option value="AVARIA">Avaria</option><option value="PRAGA">Praga</option><option value="VALIDADE">Validade</option><option value="OUTROS">Outros</option></select><label for="loss-note">Observação <span>(opcional)</span></label><textarea id="loss-note" rows="4" placeholder="Descreva o ocorrido..."></textarea><p id="form-feedback" class="feedback" role="alert"></p><button class="primary-button" type="submit">Registrar baixa</button></form></section>
        <section class="history-panel" aria-labelledby="history-title"><div class="history-header"><div><p class="eyebrow">Rastreabilidade</p><h2 id="history-title">Histórico de perdas</h2></div><div class="history-filters"><label class="sr-only" for="reason-filter">Filtrar por motivo</label><select id="reason-filter"><option value="">Todos os motivos</option><option value="DETERIORACAO">Deterioração</option><option value="AVARIA">Avaria</option><option value="PRAGA">Praga</option><option value="VALIDADE">Validade</option><option value="OUTROS">Outros</option></select><label class="sr-only" for="product-filter">Filtrar por produto</label><select id="product-filter"><option value="">Todos os produtos</option></select></div></div><p id="history-feedback" class="feedback" role="status"></p><div class="history-table-wrap"><table><thead><tr><th>Data / hora</th><th>Produto</th><th>Quantidade</th><th>Motivo</th><th>Responsável</th><th>Observação</th></tr></thead><tbody id="losses-table"></tbody></table></div><div class="pagination"><button id="previous-page" class="page-button" type="button">Anterior</button><span id="page-indicator"></span><button id="next-page" class="page-button" type="button">Próxima</button></div></section>
      </div>
    </main>
    <script src="../../services/authService.js"></script><script src="../../services/produtosService.js"></script><script src="../../services/perdasService.js"></script><script src="./perdas.js"></script>
  </body>
</html>
